<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Championship Registration Form</title>
<link rel="stylesheet" href="./grid.css">
</head>
<body>

  <div class="form-card">
    <h1 class="form-title">School Championship Registration Form</h1>

    <form onsubmit="return false;">

      <div class="field-block">
        <label for="schoolName">School name:<span class="required">*</span></label>
        <input type="text" id="schoolName" name="schoolName" required>
      </div>

      <div class="field-block">
        <label>Schooler name:<span class="required">*</span></label>
        <div class="name-row">
          <input type="text" name="schoolerFirst" placeholder="First" required>
          <input type="text" name="schoolerLast" placeholder="Last" required>
        </div>
      </div>

      <div class="field-block">
        <label>Parent name:<span class="required">*</span></label>
        <div class="name-row">
          <input type="text" name="parentFirst" placeholder="First" required>
          <input type="text" name="parentLast" placeholder="Last" required>
        </div>
      </div>

      <div class="field-block">
        <label for="parentPhone">Parent phone:<span class="required">*</span></label>
        <input type="tel" id="parentPhone" name="parentPhone" placeholder="### ### ####" required>
      </div>

      <div class="field-block">
        <label for="parentEmail">Parent email:<span class="required">*</span></label>
        <input type="email" id="parentEmail" name="parentEmail" required>
      </div>

      <div class="field-block">
        <label for="sport">Preferred sport:<span class="required">*</span></label>
        <input type="text" id="sport" name="sport" required>
      </div>

      <div class="field-block verification-block">
        <label>Verification<span class="required">*</span></label>
        <div class="captcha-box">
          <label class="captcha-check">
            <input type="checkbox" name="verification" required>
            <span class="checkmark"></span>
            I'm not a robot
          </label>
          <div class="captcha-logo">
            <svg width="28" height="28" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M12 2a10 10 0 100 20 10 10 0 000-20z" opacity="0"/>
              <circle cx="12" cy="12" r="10" fill="#e8e8e8"/>
              <path d="M8 12l2.5 2.5L16 9" stroke="#4285F4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="captcha-caption">reCAPTCHA<br>Privacy · Terms</span>
          </div>
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="submit-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M5 3l16 9-16 9V3z"/></svg>
          Submit
        </button>
      </div>

    </form>
  </div>

</body>
</html>
