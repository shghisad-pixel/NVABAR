<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log In</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card-bg: #121212;
    --input-bg: #1a1a1a;
    --border: #363636;
    --border-focus: #6b6b6b;
    --text: #f5f5f5;
    --text-muted: #a8a8a8;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-disabled: #1e3a6f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }

  .login-card {
    width: 100%;
    max-width: 350px;
    padding: 24px;
  }

  h1.title {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 20px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field {
    position: relative;
  }

  .field input {
    width: 100%;
    padding: 14px 12px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .field input::placeholder {
    color: var(--text-muted);
  }

  .field input:hover {
    border-color: var(--border-focus);
  }

  .field input:focus {
    border-color: var(--accent);
  }

  button.submit {
    margin-top: 8px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent-disabled);
    color: #cfd8e6;
    font-size: 15px;
    font-weight: 600;
    cursor: not-allowed;
    transition: background-color 0.2s ease, transform 0.05s ease;
  }

  button.submit.enabled {
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }

  button.submit.enabled:hover {
    background: var(--accent-hover);
  }

  button.submit.enabled:active {
    transform: scale(0.98);
  }

  .forgot {
    text-align: center;
    margin-top: 16px;
  }

  .forgot a {
    color: var(--text);
    font-size: 13px;
    text-decoration: none;
  }

  .forgot a:hover {
    text-decoration: underline;
    color: var(--text-muted);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .divider .line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .divider span {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .alt-login {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .alt-login:hover {
    background: var(--input-bg);
    border-color: var(--border-focus);
  }

  .alt-login svg { flex-shrink: 0; }

  .create-account {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .create-account:hover {
    background: var(--accent);
    color: #fff;
  }
</style>
</head>
<body>

  <div class="login-card">
    <h1 class="title">Log into your account</h1>

    <form onsubmit="return false;">
      <div class="field">
        <input type="text" name="identifier" placeholder="Mobile number, username or email" autocomplete="username" required>
      </div>

      <div class="field">
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="submit" id="loginBtn">Log in</button>
    </form>

    <div class="forgot">
      <a href="#">Forgot password?</a>
    </div>

    <div class="divider">
      <div class="line"></div>
      <span>OR</span>
      <div class="line"></div>
    </div>

    <button class="alt-login" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#2563eb"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      Log in with Facebook
    </button>

    <button class="create-account" type="button">Create new account</button>
  </div>

  <script>
 
    const inputs = document.querySelectorAll('input');
    const btn = document.getElementById('loginBtn');
    function checkFilled() {
      const filled = [...inputs].every(i => i.value.trim().length > 0);
      btn.classList.toggle('enabled', filled);
    }
    inputs.forEach(i => i.addEventListener('input', checkFilled));
  </script>

</body>
</html>
