<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    
body {
    margin: 0;
    padding: 20px;
    background-color: #f0f0f0;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
}

.gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

</style>
<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">
        <img src="./asstes/mountian 1.jpg" alt="Mountain">
        <img src="./asstes/forest.jpg" alt="Forest">
        <img src="./asstes/nature.jpg" alt="Nature">
        <img src="./asstes/river.jpg" alt="River">
        <img src="./asstes/animal.jpg" alt="Animal">
        <img src="./asstes/landscape.jpg" alt="Landscape">
        <img src="./asstes/beach.jpg" alt="Beach">
        <img src="./asstes/images (1).jpg" alt="Waterfall">
    </div>

</body>
</html>
