<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Navbar</title>
    <link rel="stylesheet" href="./bookwhat.css">
    <script src="https://kit.fontawesome.com/d1cc11f569.js" crossorigin="anonymous"></script>
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">
                book<span>my</span>show
            </div>

            <div class="search">
                <span>⌕</span>
                <input type="text" placeholder="Search for Movies, Events, Plays, Sports and Activities">
            </div>

            <div class="right">
                <span class="city">Pune ⌄</span>
                <button class="signin">Sign in</button>
                <div class="menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="left-links">
                <a href="#">Movies</a>
                <a href="#">Stream</a>
                <a href="#">Events</a>
                <a href="#">Plays</a>
                <a href="#">Sports</a>
                <a href="#">Activities</a>
            </div>

            <div class="right-links">
                <a href="#">ListYourShow</a>
                <a href="#">Corporates</a>
                <a href="#">Offers</a>
                <a href="#">Gift Cards</a>
            </div>
        </nav>
    </header>

</body>
</html>
